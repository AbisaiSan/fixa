# Fixa, homologação (ADR 0006). Escuta só em 127.0.0.1: quem chega aqui é o cloudflared.
server {
    listen 127.0.0.1:80;
    server_name _;
    root /var/www/fixa/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 14M;

    # IP real do visitante para o rate limit e a auditoria, em vez de 127.0.0.1.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # O visitante sempre chega por HTTPS pela Cloudflare.
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
