; Fixa, homologação (ADR 0006). Instalado em fpm/conf.d e cli/conf.d como 99-fixa.ini.
; O PDF da aula vai até 10 MB (StoreLessonRequest); o Nginx aceita 14 MB.
upload_max_filesize = 12M
post_max_size = 14M
memory_limit = 256M
expose_php = Off
; Mitigação do CVE-2026-115560, igual ao docker/8.5/php.ini (docs/versoes.md).
session.upload_progress.enabled = 0
